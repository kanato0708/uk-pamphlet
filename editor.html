<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18344d">
  <title>催事データ編集｜宇工祭2026</title>
  <style>
    :root{--ink:#18344d;--orange:#e8793b;--paper:#f4ecd9;--cream:#fffdf8;--line:#d7c7aa;--muted:#617384}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    main{width:min(100%,900px);min-height:100dvh;margin:auto;padding:24px 16px 48px;background:rgba(255,253,248,.86)}
    h1{margin:0;font-size:25px}.lead{margin:8px 0 18px;color:var(--muted);font-size:13px;line-height:1.65}.notice{margin:0 0 18px;padding:11px 13px;border:2px solid var(--ink);border-radius:6px;background:#fff;font-size:12px;line-height:1.65}
    .toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}button,.import-label{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border:2px solid var(--ink);border-radius:5px;background:var(--cream);color:var(--ink);box-shadow:2px 2px 0 var(--ink);font:700 13px inherit;cursor:pointer}.primary{background:var(--orange);color:#fff}.import-label input{display:none}
    .status{margin:0 0 14px;color:var(--muted);font-size:12px}.zone{margin:0 0 18px;border:3px solid var(--ink);border-radius:7px;background:rgba(255,255,255,.84);overflow:hidden}.zone-head{padding:11px 13px;border-bottom:2px solid var(--ink);background:var(--cream)}.zone-head h2{margin:0;font-size:17px}.zone-head small{color:var(--muted);font-weight:600}
    .events{padding:10px;display:grid;gap:10px}.event{padding:11px;border:2px solid var(--line);border-radius:5px;background:#fff}.event-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.event-number{font-size:12px;font-weight:800}.delete{min-height:auto;padding:5px 8px;border-color:#b74d42;color:#a33e35;box-shadow:none;font-size:11px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}label{display:grid;gap:4px;color:var(--muted);font-size:11px;font-weight:700}.wide{grid-column:1/-1}input,textarea,select{width:100%;border:1.5px solid var(--ink);border-radius:4px;padding:8px;background:#fffdf8;color:var(--ink);font:14px inherit}textarea{min-height:70px;resize:vertical}.add{margin:0 10px 12px;min-height:36px;box-shadow:none;font-size:12px}@media(max-width:480px){main{padding-inline:12px}.fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <h1>催事データ編集</h1>
    <p class="lead">催事名・カテゴリ・場所・時間・説明を編集し、完成したデータをダウンロードできます。</p>
    <p class="notice">ダウンロードした <strong>events.json</strong> で、このフォルダ内の同名ファイルを置き換えてください。GitHub Pagesで公開している場合は、置き換えたファイルをアップロードします。</p>
    <div class="toolbar">
      <label class="import-label">events.jsonを読み込む<input id="importFile" type="file" accept="application/json,.json"></label>
      <button id="reload" type="button">元のデータを再読み込み</button>
      <button id="download" class="primary" type="button">events.jsonをダウンロード</button>
    </div>
    <p id="status" class="status">催事データを読み込んでいます…</p>
    <div id="zones"></div>
  </main>
  <script>
    const order=["3f","2f","1f","gymA","gymB","admin","courtyard"];
    const names={"3f":"校舎 3階","2f":"校舎 2階","1f":"校舎 1階",gymA:"第1体育館",gymB:"第2体育館",admin:"管理棟",courtyard:"中庭"};
    let data={};
    const zones=document.getElementById("zones"),status=document.getElementById("status");
    const safe=value=>String(value||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function card(item,index){
      const el=document.createElement("article"); el.className="event";
      const category=item.category||"団体・案内";
      el.innerHTML='<div class="event-top"><span class="event-number">催事 '+(index+1)+'</span><button class="delete" type="button">削除</button></div><div class="fields"><label>催事名<input data-field="name" value="'+safe(item.name)+'"></label><label>カテゴリ<select data-field="category"><option value="飲食">飲食</option><option value="遊ぶ・体験">遊ぶ・体験</option><option value="展示・ステージ">展示・ステージ</option><option value="団体・案内">団体・案内</option></select></label><label>場所<input data-field="room" value="'+safe(item.room)+'"></label><label>時間<input data-field="time" value="'+safe(item.time)+'" placeholder="例：10:00〜12:00"></label><label class="wide">説明<textarea data-field="desc">'+safe(item.desc)+'</textarea></label></div>';
      el.querySelector('[data-field="category"]').value=category;
      el.querySelector(".delete").addEventListener("click",()=>{el.remove();number(el.closest(".zone"))});
      return el;
    }
    function number(zone){zone.querySelectorAll(".event-number").forEach((el,i)=>el.textContent="催事 "+(i+1))}
    function render(){
      zones.innerHTML="";
      const ids=order.concat(Object.keys(data).filter(id=>!order.includes(id)));
      ids.forEach(id=>{
        if(!data[id])return;
        const section=document.createElement("section"); section.className="zone"; section.dataset.zone=id;
        section.innerHTML='<div class="zone-head"><h2>'+safe(names[id]||data[id].label||id)+'</h2><small>'+safe(data[id].building)+'</small></div><div class="events"></div><button class="add" type="button">＋ 催事を追加</button>';
        const events=section.querySelector(".events");
        (data[id].items||[]).forEach((item,i)=>events.appendChild(card(item,i)));
        section.querySelector(".add").addEventListener("click",()=>events.appendChild(card({},events.children.length)));
        zones.appendChild(section);
      });
    }
    function updated(){
      const result=JSON.parse(JSON.stringify(data));
      document.querySelectorAll(".zone").forEach(section=>{
        result[section.dataset.zone].items=[...section.querySelectorAll(".event")].map(card=>{
          const get=field=>card.querySelector('[data-field="'+field+'"]').value.trim();
          return {name:get("name"),category:get("category"),room:get("room"),time:get("time"),desc:get("desc")};
        });
      });
      return result;
    }
    async function load(){
      status.textContent="催事データを読み込んでいます…";
      try{const res=await fetch("events.json",{cache:"no-store"});if(!res.ok)throw new Error();data=await res.json();render();status.textContent="現在の events.json を読み込みました。"}
      catch{status.textContent="自動で読み込めませんでした。「events.jsonを読み込む」からファイルを選択してください。"}
    }
    document.getElementById("reload").addEventListener("click",load);
    document.getElementById("importFile").addEventListener("change",async e=>{
      try{data=JSON.parse(await e.target.files[0].text());render();status.textContent="選択したファイルを読み込みました。"}
      catch{status.textContent="読み込めませんでした。正しいJSONファイルを選択してください。"}
    });
    document.getElementById("download").addEventListener("click",()=>{
      const blob=new Blob([JSON.stringify(updated(),null,2)+"\n"],{type:"application/json"});
      const url=URL.createObjectURL(blob),link=document.createElement("a");
      link.href=url;link.download="events.json";link.click();URL.revokeObjectURL(url);
      status.textContent="events.jsonをダウンロードしました。元のファイルと置き換えてください。";
    });
    load();
  </script>
</body>
</html>
