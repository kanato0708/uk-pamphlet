<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18344d">
  <meta name="robots" content="noindex,nofollow">
  <title>混雑状況｜宇工祭2026</title>
  <link rel="stylesheet" href="crowd.css">
  <style>
    :root{--ink:#18344d;--paper:#f4ecd9;--purple:#443088;--muted:#617384}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    #screen{height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,1.4vw,28px);gap:clamp(10px,1vw,18px);background:linear-gradient(120deg,rgba(255,253,248,.9),rgba(244,236,217,.9))}
    header{display:flex;align-items:center;gap:clamp(12px,1.5vw,24px);flex:none;border-bottom:4px solid var(--ink);padding:0 0 clamp(8px,1vw,16px)}
    .title{min-width:0}.school{font-size:clamp(11px,1.15vw,18px);font-weight:700;letter-spacing:.13em;color:#306486}.title h1{margin:2px 0 0;font-size:clamp(24px,3vw,52px);line-height:1}.title h1 span{font-size:.7em;color:var(--purple);margin-left:8px}
    .headline{margin-left:auto;text-align:right}.headline strong{display:block;font-size:clamp(18px,2.5vw,38px)}.headline p{margin:3px 0 0;font-size:clamp(11px,1.15vw,18px);font-weight:700;color:var(--muted)}
    #fullscreen{flex:none;min-height:clamp(42px,4vw,62px);padding:0 clamp(12px,1.2vw,22px);border:3px solid var(--ink);border-radius:7px;background:var(--purple);color:#fff;font:800 clamp(13px,1.2vw,18px) inherit;cursor:pointer}.fullscreen-note{display:none}
    .groups{min-height:0;flex:1;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:clamp(5px,.6vw,10px)}
    .zone{min-height:0;border:3px solid var(--ink);border-radius:8px;background:rgba(255,255,255,.75);box-shadow:3px 4px 0 rgba(24,52,77,.14);overflow:hidden;display:flex;flex-direction:column}.zone[data-zone="3f"]{grid-column:3 / 13;grid-row:1 / 3}.zone[data-zone="2f"]{grid-column:3 / 13;grid-row:3 / 5}.zone[data-zone="1f"]{grid-column:3 / 13;grid-row:5 / 7}.zone[data-zone="courtyard"]{grid-column:3 / 13;grid-row:7 / 10;background:#dcecf1}.zone[data-zone="admin"]{grid-column:4 / 11;grid-row:10 / 13}.zone[data-zone="gymB"]{grid-column:14 / 19;grid-row:2 / 5}.zone[data-zone="gymA"]{grid-column:14 / 19;grid-row:6 / 9}
    .entrance{grid-column:1 / 3;grid-row:7 / 10;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:8px;background:#dcecf1;color:var(--ink);font-size:clamp(12px,1.25vw,21px);font-weight:900;line-height:1.3;text-align:center;writing-mode:vertical-rl;box-shadow:3px 4px 0 rgba(24,52,77,.14)}
    .zone h2{flex:none;margin:0;padding:clamp(3px,.35vw,7px) clamp(7px,.65vw,11px);border-bottom:2px solid var(--ink);font-size:clamp(12px,1.05vw,19px)}.zone h2 small{font-size:.58em;color:var(--muted);margin-left:8px}
    .tiles{min-height:0;flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(3px,.3vw,6px);padding:clamp(3px,.35vw,7px)}.zone[data-zone="gymA"] .tiles,.zone[data-zone="gymB"] .tiles{grid-template-columns:1fr}.zone[data-zone="admin"] .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.zone[data-zone="courtyard"] .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
    .tile{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(4px,.5vw,9px);border:2px solid var(--ink);border-radius:5px;background:#fffdf8}.tile-room{font-size:clamp(9px,.8vw,14px);font-weight:800;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile-name{min-height:0;margin-top:2px;font-size:clamp(10px,1vw,17px);font-weight:900;line-height:1.13;overflow:hidden;overflow-wrap:anywhere}.tile .crowd-badge{flex:none;align-self:flex-start;margin-top:clamp(3px,.35vw,6px);font-size:clamp(9px,.78vw,13px);line-height:1;padding:clamp(1px,.15vw,3px) clamp(3px,.3vw,6px)}
    .zone[data-zone="3f"] .tiles,.zone[data-zone="2f"] .tiles,.zone[data-zone="1f"] .tiles{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:1fr}.zone[data-zone="3f"] .tile,.zone[data-zone="2f"] .tile,.zone[data-zone="1f"] .tile{padding:clamp(2px,.25vw,5px)}.zone[data-zone="3f"] .tile-name,.zone[data-zone="2f"] .tile-name,.zone[data-zone="1f"] .tile-name{display:none}.zone[data-zone="3f"] .tile-room,.zone[data-zone="2f"] .tile-room,.zone[data-zone="1f"] .tile-room{font-size:clamp(11px,1.15vw,20px);color:var(--ink)}.zone[data-zone="3f"] .tile .crowd-badge,.zone[data-zone="2f"] .tile .crowd-badge,.zone[data-zone="1f"] .tile .crowd-badge{margin-top:2px;font-size:clamp(8px,.68vw,12px)}
    .zone[data-zone="admin"] .tile-room,.zone[data-zone="courtyard"] .tile-room{display:none}.zone[data-zone="admin"] .tile-name,.zone[data-zone="courtyard"] .tile-name{flex:none;font-size:clamp(9px,.8vw,14px);line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.zone[data-zone="admin"] .tile .crowd-badge,.zone[data-zone="courtyard"] .tile .crowd-badge{margin-top:2px}
    @media (max-width:900px),(max-height:560px){#screen{padding:8px;gap:7px}header{border-bottom-width:2px;padding-bottom:5px}.groups{gap:4px}.zone,.entrance{border-width:2px}.zone h2{border-bottom-width:1px}.tile{border-width:1px}.school{display:none}.headline p{display:none}.fullscreen-note{display:inline}.tile-name{font-size:clamp(9px,1.25vw,13px)}}
  </style>
</head>
<body>
  <main id="screen">
    <header>
      <div class="title"><div class="school">宇都宮工業高等学校</div><h1>宇工祭<span>2026</span></h1></div>
      <div class="headline"><strong>会場の混雑状況</strong><p id="connection" role="status">混雑状況を確認しています…</p></div>
      <button id="fullscreen" type="button">全画面表示<span class="fullscreen-note"> ⛶</span></button>
    </header>
    <section id="groups" class="groups" aria-label="催事ごとの混雑状況"></section>
  </main>
  <script type="module" src="monitor.js"></script>
</body>
</html>
