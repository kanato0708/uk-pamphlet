<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18344d">
  <meta name="robots" content="noindex,nofollow">
  <title>混雑状況｜宇工祭2026</title>
  <link rel="stylesheet" href="crowd.css">
  <style>
    :root{--ink:#14324a;--paper:#f7f2e6;--purple:#443088;--muted:#526574;--quiet-bg:#e4f4e8;--quiet-fg:#205b34;--moderate-bg:#fff2ce;--moderate-fg:#745100;--busy-bg:#fce4e4;--busy-fg:#9c2424;--closed-bg:#e9e3f7;--closed-fg:#443088;--unknown-bg:#edf0f2;--unknown-fg:#475569}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    #screen{height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,1.35vw,26px);gap:clamp(8px,.8vw,14px);background:linear-gradient(120deg,#fffdf8,#f4ecd9)}
    header{display:grid;grid-template-columns:minmax(190px,1fr) auto auto;align-items:center;column-gap:clamp(14px,1.6vw,28px);flex:none;border-bottom:4px solid var(--ink);padding:0 0 clamp(8px,.8vw,14px)}
    .title{min-width:0}.school{font-size:clamp(10px,.9vw,16px);font-weight:800;letter-spacing:.13em;color:#306486}.title h1{margin:2px 0 0;font-size:clamp(27px,2.8vw,48px);line-height:.95}.title h1 span{font-size:.68em;color:var(--purple);margin-left:7px}
    .headline{text-align:right}.headline strong{display:block;font-size:clamp(20px,2.25vw,38px);line-height:1.1}.headline p{margin:4px 0 0;font-size:clamp(10px,.85vw,15px);font-weight:800;color:var(--muted)}
    #fullscreen{min-height:clamp(42px,3.7vw,60px);padding:0 clamp(12px,1.1vw,20px);border:3px solid var(--ink);border-radius:8px;background:var(--purple);color:#fff;font:800 clamp(12px,1vw,17px) inherit;cursor:pointer}.fullscreen-note{display:none}
    .legend{display:flex;justify-content:flex-end;gap:clamp(4px,.45vw,9px);margin-top:5px}.legend span{display:inline-flex;align-items:center;gap:4px;font-size:clamp(9px,.75vw,13px);font-weight:800;white-space:nowrap}.legend i{width:clamp(10px,.75vw,14px);height:clamp(10px,.75vw,14px);border:1px solid currentColor;border-radius:3px;background:var(--unknown-bg)}.legend .quiet i{background:var(--quiet-bg);color:var(--quiet-fg)}.legend .moderate i{background:var(--moderate-bg);color:var(--moderate-fg)}.legend .busy i{background:var(--busy-bg);color:var(--busy-fg)}.legend .closed i{background:var(--closed-bg);color:var(--closed-fg)}
    .groups{min-height:0;flex:1;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:clamp(5px,.55vw,10px)}
    .zone{min-height:0;border:3px solid var(--ink);border-radius:9px;background:rgba(255,255,255,.82);box-shadow:3px 4px 0 rgba(20,50,74,.13);overflow:hidden;display:flex;flex-direction:column}.zone[data-zone="3f"]{grid-column:1 / 12;grid-row:1 / 4}.zone[data-zone="2f"]{grid-column:1 / 12;grid-row:4 / 7}.zone[data-zone="1f"]{grid-column:1 / 12;grid-row:7 / 10}.zone[data-zone="admin"]{grid-column:1 / 12;grid-row:10 / 13}.zone[data-zone="courtyard"]{grid-column:12 / 15;grid-row:1 / 13;background:#d8ecf0}.zone[data-zone="gymB"]{grid-column:15 / 19;grid-row:1 / 7}.zone[data-zone="gymA"]{grid-column:15 / 19;grid-row:7 / 13}
    .zone h2{flex:none;margin:0;padding:clamp(3px,.32vw,6px) clamp(8px,.65vw,12px);border-bottom:2px solid var(--ink);font-size:clamp(12px,1vw,18px);letter-spacing:.04em}.zone[data-zone="3f"] h2::after,.zone[data-zone="2f"] h2::after,.zone[data-zone="1f"] h2::after{content:"教室棟";margin-left:8px;font-size:.67em;font-weight:700;color:var(--muted)}.zone[data-zone="admin"] h2::after{content:"← 昇降口（入口）";float:right;font-size:.7em;font-weight:700;color:var(--muted)}
    .tiles{min-height:0;flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(3px,.32vw,6px);padding:clamp(3px,.35vw,7px)}.zone[data-zone="gymA"] .tiles,.zone[data-zone="gymB"] .tiles{grid-template-columns:1fr}.zone[data-zone="courtyard"] .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.zone[data-zone="admin"] .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.zone[data-zone="3f"] .tiles,.zone[data-zone="1f"] .tiles{grid-template-columns:repeat(8,minmax(0,1fr))}.zone[data-zone="2f"] .tiles{grid-template-columns:repeat(7,minmax(0,1fr))}
    .tile{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(4px,.45vw,8px);border:2px solid var(--ink);border-radius:6px;background:var(--unknown-bg);color:var(--unknown-fg);overflow:hidden}.tile[data-tone="quiet"]{background:var(--quiet-bg);color:var(--quiet-fg)}.tile[data-tone="moderate"]{background:var(--moderate-bg);color:var(--moderate-fg)}.tile[data-tone="busy"]{background:var(--busy-bg);color:var(--busy-fg)}.tile[data-tone="closed"]{background:var(--closed-bg);color:var(--closed-fg)}.tile[data-tone="unknown"]{background:var(--unknown-bg);color:var(--unknown-fg)}
    .tile-room{font-size:clamp(10px,.85vw,15px);font-weight:900;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile-name{width:100%;margin-top:2px;font-size:clamp(10px,.9vw,16px);font-weight:900;line-height:1.08;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile .crowd-badge{display:inline-flex;align-items:center;min-height:0;flex:none;margin:clamp(3px,.28vw,5px) 0 0;max-width:100%;padding:2px 3px;border:1px solid currentColor;border-radius:4px;background:inherit;color:inherit;font-size:clamp(9px,.72vw,13px);font-weight:900;line-height:1.25;white-space:normal;overflow-wrap:anywhere;text-align:center}
    .zone[data-zone="3f"] .tile,.zone[data-zone="2f"] .tile,.zone[data-zone="1f"] .tile{align-items:center;padding:clamp(3px,.3vw,6px)}.zone[data-zone="3f"] .tile-room,.zone[data-zone="2f"] .tile-room,.zone[data-zone="1f"] .tile-room{font-size:clamp(18px,1.6vw,30px);line-height:1}.zone[data-zone="3f"] .tile-name,.zone[data-zone="2f"] .tile-name,.zone[data-zone="1f"] .tile-name{display:none}.zone[data-zone="3f"] .tile .crowd-badge,.zone[data-zone="2f"] .tile .crowd-badge,.zone[data-zone="1f"] .tile .crowd-badge{margin-top:4px;font-size:clamp(9px,.75vw,14px)}
    .zone[data-zone="courtyard"] .tile-room,.zone[data-zone="admin"] .tile-room{display:none}.zone[data-zone="courtyard"] .tile,.zone[data-zone="admin"] .tile{padding:clamp(3px,.32vw,6px)}.zone[data-zone="courtyard"] .tile-name,.zone[data-zone="admin"] .tile-name{margin:0;font-size:clamp(9px,.76vw,14px)}.zone[data-zone="admin"] .tile-name{font-size:clamp(11px,.95vw,17px);line-height:1.13;white-space:normal}.zone[data-zone="courtyard"] .tile-name{font-size:clamp(9px,.72vw,13px);line-height:1.12;white-space:normal}.zone[data-zone="courtyard"] .tile .crowd-badge,.zone[data-zone="admin"] .tile .crowd-badge{margin-top:2px;font-size:clamp(8px,.62vw,11px)}.zone[data-zone="admin"] .tile .crowd-badge{font-size:clamp(10px,.78vw,14px)}.zone[data-zone="courtyard"] .tile .crowd-badge{font-size:clamp(8px,.65vw,12px)}
    @media (max-width:900px),(max-height:560px){#screen{padding:8px;gap:7px}header{border-bottom-width:2px;padding-bottom:5px}.school,.headline p,.legend{display:none}.groups{gap:4px}.zone,.entrance{border-width:2px}.zone h2{border-bottom-width:1px}.tile{border-width:1px}.fullscreen-note{display:inline}.tile-room{font-size:10px}.zone[data-zone="3f"] .tile-room,.zone[data-zone="2f"] .tile-room,.zone[data-zone="1f"] .tile-room{font-size:13px}.tile .crowd-badge{padding:1px 3px;font-size:8px}}
  </style>
</head>
<body>
  <main id="screen">
    <header>
      <div class="title"><div class="school">宇都宮工業高等学校</div><h1>宇工祭<span>2026</span></h1></div>
      <div class="headline"><strong>会場の混雑状況</strong><p id="connection" role="status">混雑状況を確認しています…</p><div class="legend" aria-label="混雑状況の凡例"><span class="quiet"><i></i>空き</span><span class="moderate"><i></i>やや混雑</span><span class="busy"><i></i>混雑</span><span class="closed"><i></i>終了</span><span><i></i>要確認</span></div></div>
      <button id="fullscreen" type="button">全画面表示<span class="fullscreen-note"> ⛶</span></button>
    </header>
    <section id="groups" class="groups" aria-label="催事ごとの混雑状況"></section>
  </main>
  <script type="module" src="monitor.js"></script>
</body>
</html>
