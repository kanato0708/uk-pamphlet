<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#18344d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="宇工祭2026">
<title>宇工祭2026 デジタルパンフレット</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="announcement.css">
<style>
  :root{--ink:#18344d;--blue:#306486;--orange:#e8793b;--cream:#fffdf8;--paper:#f4ecd9;--line:#d7c7aa;--muted:#617384}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
  body{background-image:linear-gradient(rgba(97,115,132,.09) 1px,transparent 1px);background-size:100% 30px}
  #app{width:min(100%,680px);min-height:100dvh;margin:auto;background:rgba(255,253,248,.8);border-inline:1px solid rgba(215,199,170,.55)}
  .banner{position:relative;text-align:center;padding:calc(18px + env(safe-area-inset-top)) 56px 15px;border-bottom:3px solid var(--ink);background:rgba(255,253,248,.92)}
  .mascot{position:absolute;left:16px;bottom:10px;width:auto;height:48px;object-fit:contain}
  .school{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--blue)}
  h1{margin:3px 0 0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:27px;letter-spacing:.06em;line-height:1.1}
  h1 span{color:var(--orange);font-size:.86em;margin-left:3px}.theme{font-size:12px;margin-top:4px;font-weight:600;color:var(--muted)}
  .saiji-link{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:18px auto calc(24px + env(safe-area-inset-bottom));padding:15px 18px;border:3px solid var(--ink);border-radius:7px;background:#443088;box-shadow:4px 4px 0 var(--ink);color:#fff;text-decoration:none;font-size:17px;font-weight:800;letter-spacing:.06em}.saiji-link:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.saiji-link .arrow{font-size:22px;line-height:0}
  .line-entry{text-align:center;margin:24px 16px 28px}.line-entry img{max-width:100%;height:36px}.line-entry a:focus-visible{outline:3px solid #306486;outline-offset:4px}
  .admin-entry{display:block;width:max-content;max-width:calc(100% - 32px);margin:40px auto 24px;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}.admin-entry:hover{color:var(--ink)}.admin-entry:focus-visible{outline:3px solid #306486;outline-offset:3px}
  .intro{padding:11px 18px 8px;font-size:12px;text-align:center;color:var(--muted)}
  .building{margin:0 15px 16px;border:3px solid var(--ink);border-radius:6px;background:rgba(255,255,255,.85);box-shadow:3px 4px 0 rgba(24,52,77,.13)}
  .building-head{display:flex;align-items:center;gap:9px;padding:9px 12px 8px;border-bottom:2px solid var(--ink)}
  .building-head svg{height:34px;width:34px;flex:none}.building-head strong{font-size:16px}.building-head span{font-size:11px;color:var(--muted)}
  .floor{display:grid;grid-template-columns:69px 1fr;border-bottom:2px solid var(--ink);min-height:82px}.floor:last-child{border-bottom:0}
  .floor-label{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px solid var(--ink);font-weight:800;font-size:18px;line-height:1.05}.floor-label small{font-size:10px;color:var(--muted);margin-top:4px;font-weight:600}
  .rooms{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:8px}
  .room-btn{appearance:none;border:2px solid var(--ink);border-radius:4px;background:#fffdf8;color:var(--ink);padding:4px 2px;min-height:62px;font:700 10px/1.1 inherit;cursor:pointer;transition:.15s transform,.15s background,.15s color;writing-mode:vertical-rl;text-orientation:upright;justify-self:stretch;word-break:break-all}
  .room-btn:active{transform:scale(.95)}.room-btn.selected{background:#443088;color:white;box-shadow:2px 2px 0 var(--ink)}
  .facilities{display:grid;grid-template-columns:69px 1fr 1fr;margin:0 15px 15px;min-height:82px;border:3px solid var(--ink);border-radius:6px;background:rgba(255,255,255,.85);box-shadow:3px 4px 0 rgba(24,52,77,.13);overflow:hidden}
  .facility-label{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px solid var(--ink);font-size:14px;font-weight:800;line-height:1.25}.facility-label small{margin-top:4px;font-size:9px;font-weight:600;color:var(--muted)}
  .facility{border:0;border-right:2px solid var(--ink);border-radius:0;background:#fffdf8;color:var(--ink);font:800 13px/1.3 inherit;cursor:pointer;transition:.15s transform,.15s background;padding:8px}.facility:last-child{border-right:0}.facility:active{transform:scale(.97)}.facility.selected{background:#443088;color:white}
  .detail{margin:0 15px;padding:0 0 calc(20px + env(safe-area-inset-bottom));border-top:3px solid var(--ink)}
  .detail-title{display:flex;align-items:center;gap:8px;padding:11px 2px 8px}.detail-title .tag{border:2px solid var(--ink);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;background:#fff}.detail-title h2{font-size:17px;margin:0}.detail-title p{font-size:11px;color:var(--muted);margin:0 0 0 auto}
  #eventList{border:2px solid var(--ink);border-radius:5px;background:rgba(255,255,255,.88);min-height:130px;overflow:hidden}.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}.event{padding:13px 14px;border-bottom:1px dashed var(--line)}.event:last-child{border-bottom:0}.event-top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}.event-name{font-size:16px;font-weight:800}.event-time{font-size:11px;color:var(--orange);font-weight:800;white-space:nowrap}.event-room{font-size:11px;color:var(--muted);margin-top:3px}.event-desc{font-size:13px;line-height:1.55;margin-top:5px}./*event-image{display:block;width:min(62%,260px);aspect-ratio:16/9;object-fit:cover;margin:12px auto 4px;border:1px dashed var(--line);border-radius:4px;background:var(--paper)}*/
</style>
</head>
<body>
<main id="app">
  <header class="banner">
    <img class="mascot" src="uk-lion.png" alt="UKライオン">
    <div class="school">宇都宮工業高等学校</div><h1>宇工祭<span>2026</span></h1><div class="theme">〜 唯一無二の瞬間を 〜</div>
  </header>
  <aside class="announcement-bar" aria-label="お知らせ" hidden><span class="announcement-label">お知らせ</span><div class="announcement-window"><span class="announcement-text"></span></div></aside>

  <img src="poster.jpg" style="max-width: 100%; height: auto;" alt="宇工祭ポスター">

</main>
